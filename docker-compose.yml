version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: displayads_postgres
    restart: always
    environment:
      POSTGRES_DB: displayads
      POSTGRES_USER: displayadsuser
      POSTGRES_PASSWORD: displayadspass123
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - displayads_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U displayadsuser -d displayads"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: displayads_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - displayads_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: .
    container_name: displayads_api
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_NAME=displayads
      - DJANGO_DB_USER=displayadsuser
      - DJANGO_DB_PASSWORD=displayadspass123
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,api
      - REDIS_URL=redis://redis:6379/0
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_BUCKET_NAME=media
    networks:
      - displayads_network
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build: ./Workspace
    container_name: displayads_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Workspace:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    networks:
      - displayads_network

  minio:
    image: minio/minio:latest
    container_name: displayads_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - displayads_network

  # One-off init job to create the media bucket and allow anonymous download (public read)
  minio-setup:
    image: minio/mc:latest
    container_name: displayads_minio_setup
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mc alias set local http://minio:9000 minioadmin minioadmin
      echo 'Waiting for MinIO...'
      until mc ls local >/dev/null 2>&1; do sleep 1; done
      mc mb -p local/media || true
      mc anonymous set download local/media || true
      cat > /tmp/cors.json <<'EOF'
      [
        {
          "AllowedMethod": ["GET", "HEAD"],
          "AllowedOrigin": [
            "http://localhost:5173",
            "http://127.0.0.1:5173",
            "http://localhost:8000",
            "http://127.0.0.1:8000"
          ],
          "AllowedHeader": ["*"],
          "ExposeHeader": ["ETag"],
          "MaxAgeSeconds": 3000
        }
      ]
      EOF
      mc cors set local/media /tmp/cors.json || true
      echo 'MinIO media bucket ensured with public read + CORS.'
    restart: "no"
    networks:
      - displayads_network

  # TV Simulator
  tv-simulator:
    image: nginx:alpine
    container_name: displayads_tv_simulator
    ports:
      - "8080:80"
    volumes:
      - ./tv-simulator.html:/usr/share/nginx/html/index.html
      - ./simple-test.html:/usr/share/nginx/html/simple.html
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - api
    networks:
      - displayads_network

volumes:
  postgres_data:
  redis_data:
  media_data:
  minio_data:

networks:
  displayads_network:
    driver: bridge
