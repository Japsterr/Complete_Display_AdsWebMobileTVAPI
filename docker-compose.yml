version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: displayads
      POSTGRES_USER: displayadsuser
      POSTGRES_PASSWORD: displayadspass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    command: gunicorn signage_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_NAME=displayads
      - DJANGO_DB_USER=displayadsuser
      - DJANGO_DB_PASSWORD=displayadspass
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_BUCKET_NAME=media

  frontend:
    build: ./Workspace
    ports:
      - "5173:5173"
    depends_on:
      - api

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  # One-off init job to create the media bucket and allow anonymous download (public read)
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: |
      mc alias set local http://minio:9000 minioadmin minioadmin
      echo 'Waiting for MinIO...'
      until mc ls local >/dev/null 2>&1; do sleep 1; done
      mc mb -p local/media || true
      mc anonymous set download local/media || true
      cat > /tmp/cors.json <<'EOF'
      [
        {
          "AllowedMethod": ["GET", "HEAD"],
          "AllowedOrigin": [
            "http://localhost:5173",
            "http://127.0.0.1:5173",
            "http://localhost:5174",
            "http://127.0.0.1:5174",
            "http://localhost:5175",
            "http://127.0.0.1:5175",
            "http://localhost:8000"
          ],
          "AllowedHeader": ["*"],
          "ExposeHeader": ["ETag"],
          "MaxAgeSeconds": 3000
        }
      ]
      EOF
      mc cors set local/media /tmp/cors.json || true
      echo 'MinIO media bucket ensured with public read + CORS.'
    restart: "no"

volumes:
  postgres_data:
  media_data:
  minio_data:
